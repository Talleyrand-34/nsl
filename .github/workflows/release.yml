name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/nsl-graph-linux-amd64" .
          chmod +x "dist/nsl-graph-linux-amd64"

      - name: Verify version propagated
        run: |
          ver="${GITHUB_REF_NAME#v}"
          test "$ver" != "" || (echo "empty version from tag" && exit 1)
          # version is NOT embedded in the binary (intentional, per project decision)
          echo "version=$ver"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsl-graph-linux-amd64-${{ github.ref_name }}
          path: dist/nsl-graph-linux-amd64
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/nsl-graph-linux-amd64