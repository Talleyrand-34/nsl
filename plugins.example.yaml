# NSL-Graph Plugin Configuration Example
# Copy this file to plugins.yaml and modify as needed

# ============================================================================
# PLUGIN SYSTEM OVERVIEW
# ============================================================================
# The plugin system allows you to customize how data is processed without
# modifying the core CloverDB implementation. Currently, connection sorting
# plugins are supported.
#
# Usage:
#   1. Copy this file to plugins.yaml
#   2. Modify the 'active' field to select your desired plugin
#   3. Run nsl-graph commands as usual
#
# The plugin configuration can also be specified via command-line flag:
#   nsl-graph --plugin-config=/path/to/config.yaml print connection
#
# ============================================================================

plugins:
  connection_sorters:
    # ========================================================================
    # ACTIVE SORTER CONFIGURATION
    # ========================================================================
    # Specify which sorting plugin to use. Only one plugin can be active.
    # When you change this value, all GetConnections() calls will use the
    # new sorting strategy.
    #
    # Available options:
    #   - insertion_order (default): No sorting, preserves database order
    #   - zone_name: Sort by zone names (useful for zone-based reports)
    #   - device_name: Sort by device names (useful for device-based reports)
    #   - reverse_id: Newest connections first (useful for recent changes)
    # ========================================================================

    active: "insertion_order"

    # EXAMPLE CONFIGURATIONS:

    # For zone-based network diagrams:
    # active: "zone_name"

    # For device-focused documentation:
    # active: "device_name"

    # To see most recent connections first:
    # active: "reverse_id"

    # ========================================================================
    # AVAILABLE PLUGINS (Metadata)
    # ========================================================================
    # This section documents all registered plugins. The information here
    # is for reference only; the actual plugins are registered in the code.
    # ========================================================================

    available:
      - id: "insertion_order"
        name: "Database Insertion Order (Default)"
        description: |
          Maintains the original CloverDB insertion order without any sorting.
          This is the default behavior and preserves the order in which
          connections were added to the database.

          Use case: When you want to maintain historical order or when
          performance is critical (no sorting overhead).

      - id: "zone_name"
        name: "Sort by Zone Name"
        description: |
          Sorts connections hierarchically by:
            1. FromZoneName (primary)
            2. ToZoneName (secondary)
            3. FromDevice (tertiary)

          Use case: Network diagrams organized by security zones or
          network segments. Useful for visualizing inter-zone traffic.

          Example output order:
            - DMZ -> DMZ -> device1
            - DMZ -> Internal -> device2
            - Internal -> DMZ -> device3
            - Internal -> Internal -> device4

      - id: "device_name"
        name: "Sort by Device Name"
        description: |
          Sorts connections hierarchically by:
            1. FromDevice (primary)
            2. ToDevice (secondary)
            3. FromModelPort (tertiary)

          Use case: Device-centric documentation or reports. Groups all
          connections from the same source device together.

          Example output order:
            - router1 -> switch1 -> eth0
            - router1 -> switch2 -> eth1
            - switch1 -> server1 -> port1
            - switch1 -> server2 -> port1

      - id: "reverse_id"
        name: "Reverse ID Order"
        description: |
          Reverses the connection order to show newest connections first.
          This is a simple reversal of the insertion order.

          Use case: Auditing recent changes, debugging new connections,
          or generating reports focused on recent network modifications.

# ============================================================================
# CREATING CUSTOM PLUGINS
# ============================================================================
# To create a custom connection sorter plugin:
#
# 1. Create a new file in internal/repository/plugins/builtin/
# 2. Implement the ConnectionSorterPlugin interface:
#      type MyCustomSorter struct{}
#      func (m *MyCustomSorter) ID() string { return "my_custom" }
#      func (m *MyCustomSorter) Name() string { return "My Custom Sorter" }
#      func (m *MyCustomSorter) Description() string { return "..." }
#      func (m *MyCustomSorter) SortConnections([]Connection) []Connection { ... }
#
# 3. Register it in cmd/utils/utils.go ServiceConnection():
#      registry.RegisterSorter(builtin.NewMyCustomSorter())
#
# 4. Add its ID to this config file:
#      active: "my_custom"
#
# 5. Rebuild the binary:
#      go build -o nsl-graph main.go
#
# ============================================================================

# ============================================================================
# TROUBLESHOOTING
# ============================================================================
# If the plugin system isn't working as expected:
#
# 1. Check the config file path:
#      nsl-graph print connection --plugin-config=plugins.yaml
#
# 2. Verify the plugin ID matches exactly (case-sensitive):
#      active: "zone_name"  ✓ correct
#      active: "Zone_Name"  ✗ wrong
#
# 3. Check logs for warnings:
#      nsl-graph --verbose print connection
#
# 4. Test with default config:
#      mv plugins.yaml plugins.yaml.backup
#      nsl-graph print connection  # Uses default: insertion_order
#
# ============================================================================
