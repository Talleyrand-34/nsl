frr version 10.4.1
frr defaults traditional
hostname OpenWrt
log syslog
!
password zebra
!
router ospf
 ospf router-id 4.4.4.4
 network 10.1.4.0/24 area 0
 network 10.10.34.0/30 area 0
 network 10.10.45.0/30 area 0
 network 10.20.34.0/30 area 0
 network 10.20.45.0/30 area 0
exit
!
access-list vty seq 5 permit 127.0.0.0/8
access-list vty seq 10 deny any
!
line vty
 access-class vty
exit
!
