frr version 10.4.1
frr defaults traditional
hostname OpenWrt
!
router bgp 65000
 bgp router-id 4.4.4.4
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.5 remote-as 65000
 neighbor 10.255.0.5 update-source lo
 !
 address-family ipv4 unicast
  network 10.1.4.0/24
  neighbor 10.255.0.1 next-hop-self
  neighbor 10.255.0.2 next-hop-self
  neighbor 10.255.0.5 next-hop-self
 exit-address-family
exit
!
router ospf
 ospf router-id 4.4.4.4
 network 10.10.23.0/30 area 0
 network 10.10.45.0/30 area 0
 network 10.20.23.0/30 area 0
 network 10.20.45.0/30 area 0
 network 10.255.0.4/32 area 0
exit
!
